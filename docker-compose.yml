services:
  postgres:
    image: postgres:15-alpine
    container_name: jaquealrey-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: jaquealrey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: jaquealrey
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # El orden de las migraciones esta declarado UNA vez, en el array
      # MIGRACIONES de db/run.js (`npm run db:list` lo muestra). Acui se
      # replican los numeros porque Docker los ejecuta por orden alfabetico de
      # nombre de archivo: si se agrega, saca o reordena una migracion, actualiza
      # los dos lugares. `npm run db:migrate` aplica el mismo orden sin Docker.
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./db/rol.sql:/docker-entrypoint-initdb.d/02-rol.sql
      - ./db/rls.sql:/docker-entrypoint-initdb.d/03-rls.sql
      - ./db/pagos.sql:/docker-entrypoint-initdb.d/04-pagos.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/05-seed.sql
      - ./db/recepcion.sql:/docker-entrypoint-initdb.d/06-recepcion.sql
      - ./db/push_tokens.sql:/docker-entrypoint-initdb.d/07-push_tokens.sql
      - ./db/security.sql:/docker-entrypoint-initdb.d/08-security.sql
      - ./db/optimize_indexes.sql:/docker-entrypoint-initdb.d/09-optimize_indexes.sql
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=8MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c max_parallel_maintenance_workers=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaquealrey"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jaquealrey-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD in the environment}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD in the environment}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
